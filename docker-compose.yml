version: "3.9"

services:
  backend:
    build:
      context: .
    container_name: salon-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://chatbot:chatbot@db:5432/chatbot
    volumes:
      - ./src/tenants/tenants.json:/app/src/tenants/tenants.json
      - ./data:/app/data
    depends_on:
      - db
    restart: unless-stopped

  admin:
    build:
      context: ./apps/admin
    container_name: salon-admin
    ports:
      - "4173:80"
    depends_on:
      - backend
    restart: unless-stopped

  owner:
    build:
      context: ./apps/owner
      args:
        VITE_API_BASE_URL: http://localhost:3000
    container_name: salon-owner
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: unless-stopped

  booking:
    build:
      context: ./apps/booking
      args:
        VITE_PUBLIC_API_BASE_URL: http://localhost:3000
    container_name: salon-booking
    ports:
      - "5180:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: salon-db
    environment:
      - POSTGRES_USER=chatbot
      - POSTGRES_PASSWORD=chatbot
      - POSTGRES_DB=chatbot
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
